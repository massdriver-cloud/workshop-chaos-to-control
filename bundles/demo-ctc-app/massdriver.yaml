schema: draft-07
name: demo-ctc-app
description: "Demo App - Workshop: From Chaos to Control"
type: application

params:
  required:
    - policy
  properties:
    policy:
      type: string
      title: "DynamoDB IAM Policy"
      description: "IAM policy to be assigned to this application's role"
      $md.enum:
        connection: "dynamodb_table"
        options: ".data.security.iam | keys"
        label: "ascii_upcase"

connections:
  required:
    - dynamodb_table
  properties:
    dynamodb_table:
      $ref: massdriver/aws-dynamodb-table

artifacts: {}

ui:
  ui:order:
    - policy

steps:
  - path: src
    provisioner: opentofu:1.10
